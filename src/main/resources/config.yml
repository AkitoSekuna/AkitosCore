# AkitosCore Configuration

# Language to use for all Akito's plugins
# Available: en, ru
language: en

# Economy settings
economy:
  currency-name: "Pixels"
  currency-symbol: "px"
  starting-balance: 100.0

# Player data settings
data:
  # How often player data is saved to disk, in seconds.
  # Minimum: 30. Maximum: 3600.
  save-interval-seconds: 300

# Anonymous usage metrics via bStats (https://bstats.org)
# Addons report data through AkitosCore rather than talking to bStats directly.
metrics:
  enabled: true
